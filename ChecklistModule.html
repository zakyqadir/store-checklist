<!-- ======================================================== -->
<!-- CHECKLIST FORM: STRICT OPENING VS REGULAR ISOLATION      -->
<!-- ======================================================== -->
<main id="auditFormView" class="hidden max-w-4xl mx-auto px-4 py-5 space-y-4 print:hidden">
  
  <div class="bg-white p-4 rounded border border-corp-border shadow-xs space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-corp-border pb-3">
      <div>
        <h2 class="text-xs font-black uppercase tracking-wider text-corp-dark">Form Walkthrough Operasional</h2>
        <p id="txtChecklistSubhead" class="text-[11px] text-corp-muted mt-0.5">Daftar evaluasi otomatis menyesuaikan Jabatan &amp; Frekuensi</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- PILIHAN TOKO KUNJUNGAN KHUSUS RM -->
        <div id="containerChecklistStoreSelect" class="hidden flex items-center space-x-1">
          <span class="text-[10px] font-black uppercase text-brand">Kunjungan:</span>
          <select id="selectAuditStore" class="px-2 py-1 rounded border border-brand bg-brand-surface font-bold text-xs text-corp-dark focus:outline-hidden">
            <!-- Diisi dinamis -->
          </select>
        </div>

        <!-- TIPE CHECKLIST EKSPLISIT: TERBUKA UNTUK SELURUH ROLE OPERASIONAL TOKO -->
        <div id="containerChecklistType">
          <select id="selectChecklistType" onchange="syncChecklistControls()" class="px-2.5 py-1 rounded border border-corp-border bg-corp-surface font-bold text-xs text-corp-dark">
            <option value="REGULAR">Regular Walkthrough</option>
            <option value="OPENING">Opening Store</option>
            <option value="CLOSING">Closing Store</option>
          </select>
        </div>

        <div>
          <select id="selectFrequency" onchange="syncChecklistControls()" class="px-2.5 py-1 rounded border border-corp-border bg-corp-surface font-bold text-xs text-corp-dark">
            <option value="Daily">Daily Walkthrough</option>
            <option value="Weekly">Weekly Walkthrough</option>
            <option value="Monthly">Monthly Walkthrough</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div id="checklistQuestionsContainer" class="space-y-3">
    <div class="bg-white p-6 rounded border border-corp-border text-center text-xs text-corp-muted">
      Menghubungkan butir evaluasi...
    </div>
  </div>

  <div class="bg-white p-3.5 rounded border border-corp-border shadow-xs space-y-2">
    <label class="block text-[10px] font-black uppercase tracking-wider text-corp-muted">Catatan Keseluruhan Walkthrough</label>
    <textarea id="txtGlobalNotes" rows="2" placeholder="Catatan kondisi toko..." class="w-full p-2.5 rounded border border-corp-border bg-corp-surface text-xs font-semibold text-corp-dark focus:bg-white focus:outline-hidden"></textarea>
    
    <div class="pt-2">
      <button type="button" id="btnSubmitChecklist" onclick="handleChecklistSubmission()" class="w-full py-2.5 rounded bg-brand hover:bg-brand-dark text-white font-black text-xs uppercase tracking-wider shadow-xs transition">
        Submit Laporan Walkthrough
      </button>
    </div>
  </div>
</main>

<script>
  var activeQuestions = [];
  var formAnswers = {};

  function syncChecklistControls() {
    if (!masterData.questions || masterData.questions.length === 0) return;

    var curRole = (currentUser && currentUser.role) ? currentUser.role : "SA";
    var cStoreContainer = document.getElementById("containerChecklistStoreSelect");
    var cTypeContainer = document.getElementById("containerChecklistType");
    var cTypeSelect = document.getElementById("selectChecklistType");
    var freqSelect = document.getElementById("selectFrequency");

    // RM MEMILIH TOKO KUNJUNGAN & TERKUNCI PADA REGULAR
    if (curRole === "RM" || (currentUser && currentUser.storeCode === "ALL")) {
      if (cStoreContainer) {
        cStoreContainer.classList.remove("hidden");
        populateChecklistStoreDropdown();
      }
      if (cTypeContainer) cTypeContainer.classList.add("hidden");
      if (cTypeSelect) cTypeSelect.value = "REGULAR";
    } else {
      if (cStoreContainer) cStoreContainer.classList.add("hidden");
      if (cTypeContainer) cTypeContainer.classList.remove("hidden");
    }

    var selectedType = cTypeSelect ? cTypeSelect.value.trim().toUpperCase() : "REGULAR";
    var curFreq = freqSelect ? freqSelect.value.trim().toLowerCase() : "daily";

    // FILTER KETAT: ISOLASI TOTAL OPENING DENGAN REGULAR
    activeQuestions = masterData.questions.filter(function(q) {
      var itemType = String(q.checklistType || "REGULAR").trim().toUpperCase();
      var qReqRole = String(q.requiredRole || "").toUpperCase().trim();
      var qFreq = String(q.frequency || "Daily").trim().toLowerCase();

      // 1. Validasi Tipe Eksplisit
      if (selectedType === "OPENING") {
        if (itemType !== "OPENING") return false;
        // Buka Opening untuk semua role operasional toko
        return true;
      } else if (selectedType === "CLOSING") {
        if (itemType !== "CLOSING") return false;
        return true;
      } else {
        // REGULAR WALKTHROUGH: Haram menampilkan soal OPENING atau CLOSING
        if (itemType === "OPENING" || itemType === "CLOSING") return false;

        var freqMatch = (qFreq === curFreq);
        var roleMatch = false;

        if (qReqRole === "ALL") {
          roleMatch = true;
        } else {
          var rolesArr = qReqRole.split(/[\s,\/]+/);
          roleMatch = (rolesArr.indexOf(curRole) !== -1 || qReqRole === curRole);
        }

        return roleMatch && freqMatch;
      }
    });

    renderQuestionsUI();
  }

  function populateChecklistStoreDropdown() {
    var select = document.getElementById("selectAuditStore");
    if (!select || !masterData.stores || select.options.length > 0) return;
    masterData.stores.forEach(function(s) {
      var opt = document.createElement("option");
      opt.value = s.siteCode;
      opt.innerText = s.siteCode + " - " + s.siteName;
      select.appendChild(opt);
    });
  }

  function renderQuestionsUI() {
    var container = document.getElementById("checklistQuestionsContainer");
    if (!container) return;

    var curJob = (currentUser && currentUser.jobTitle) ? currentUser.jobTitle : "Auditor";
    var cTypeSelect = document.getElementById("selectChecklistType");
    var curType = cTypeSelect ? cTypeSelect.value : "REGULAR";

    if (activeQuestions.length === 0) {
      container.innerHTML = '<div class="bg-white p-6 rounded border border-corp-border text-center text-xs text-corp-muted">' +
        'Tidak ada butir evaluasi terdaftar di <b>Question_Bank</b> untuk tipe <b>' + curType + '</b>.' +
        '</div>';
      return;
    }

    var htmlContent = "";
    for (var idx = 0; idx < activeQuestions.length; idx++) {
      var q = activeQuestions[idx];
      var ans = formAnswers[q.id] || { status: null, issue: '', actionPlan: '', photo: '' };
      var isPass = (ans.status === 'Pass');
      var isFail = (ans.status === 'Fail');

      htmlContent += '<div class="bg-white p-3.5 rounded border border-corp-border shadow-xs space-y-2.5">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<div>' +
            '<span class="text-[9px] font-black uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 text-corp-muted">' + q.category + ' (' + q.id + ')</span>' +
            '<h4 class="text-xs font-bold text-corp-dark mt-1">' + (idx + 1) + '. ' + q.text + '</h4>' +
          '</div>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-2 pt-1">' +
          '<button type="button" onclick="setAnswer(\'' + q.id + '\', \'Pass\')" class="py-2 rounded font-bold text-xs border ' + (isPass ? 'bg-emerald-700 text-white' : 'bg-slate-50 text-corp-muted border-corp-border') + '">Pass</button>' +
          '<button type="button" onclick="setAnswer(\'' + q.id + '\', \'Fail\')" class="py-2 rounded font-bold text-xs border ' + (isFail ? 'bg-brand text-white' : 'bg-slate-50 text-corp-muted border-corp-border') + '">Fail</button>' +
        '</div>' +

        // DUAL FAIL: EVENT ONINPUT MENCEGAH VALUE HILANG
        '<div class="' + (isFail ? 'block' : 'hidden') + ' p-3 rounded bg-rose-50 border border-rose-200 space-y-2.5 text-xs">' +
          '<div>' +
            '<label class="block font-black text-[10px] uppercase text-rose-900 mb-1">1. Uraian Temuan Kerusakan / Issue *</label>' +
            '<input type="text" id="issue_' + q.id + '" value="' + (ans.issue || '') + '" oninput="updateFailData(\'' + q.id + '\', \'issue\')" placeholder="Jelaskan detail ketidaksesuaian fisik..." class="w-full p-2 rounded border border-rose-200 bg-white font-semibold text-rose-950 focus:outline-hidden">' +
          '</div>' +
          '<div>' +
            '<label class="block font-black text-[10px] uppercase text-rose-900 mb-1">2. Rencana Tindakan Perbaikan / Action Plan *</label>' +
            '<input type="text" id="plan_' + q.id + '" value="' + (ans.actionPlan || '') + '" oninput="updateFailData(\'' + q.id + '\', \'actionPlan\')" placeholder="Tindakan korektif yang wajib dilakukan toko..." class="w-full p-2 rounded border border-rose-200 bg-white font-semibold text-rose-950 focus:outline-hidden">' +
          '</div>' +
          '<div>' +
            '<label class="block font-black text-[10px] uppercase text-rose-900 mb-1">3. Foto Bukti Temuan (Kamera / Unggah)</label>' +
            '<input type="file" id="photo_' + q.id + '" accept="image/*" capture="environment" onchange="handlePhotoUpload(\'' + q.id + '\')" class="w-full text-[11px] text-rose-950 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-[10px] file:font-black file:bg-rose-200 file:text-rose-900 hover:file:bg-rose-300">' +
            (ans.photo ? '<div class="mt-1 text-[10px] font-bold text-emerald-800">✓ Foto berhasil dipilih</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }
    container.innerHTML = htmlContent;
  }

  function setAnswer(qId, status) {
    if (!formAnswers[qId]) formAnswers[qId] = { status: null, issue: '', actionPlan: '', photo: '' };
    formAnswers[qId].status = status;
    renderQuestionsUI();
  }

  function updateFailData(qId, field) {
    var el = document.getElementById(field + '_' + qId);
    if (!formAnswers[qId]) formAnswers[qId] = { status: 'Fail', issue: '', actionPlan: '', photo: '' };
    if (el) formAnswers[qId][field] = el.value;
  }

  function handlePhotoUpload(qId) {
    var fileInput = document.getElementById('photo_' + qId);
    if (fileInput && fileInput.files && fileInput.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        if (!formAnswers[qId]) formAnswers[qId] = { status: 'Fail', issue: '', actionPlan: '', photo: '' };
        formAnswers[qId].photo = e.target.result;
        renderQuestionsUI();
      };
      reader.readAsDataURL(fileInput.files[0]);
    }
  }

  function handleChecklistSubmission() {
    var btn = document.getElementById("btnSubmitChecklist");
    var unans = [];
    var invalidFails = [];
    var answersPayload = [];

    // DIRECT DOM FALLBACK SEBELUM VALIDASI
    for (var i = 0; i < activeQuestions.length; i++) {
      var q = activeQuestions[i];
      var a = formAnswers[q.id];

      if (!a || !a.status) {
        unans.push(q.id);
      } else {
        if (a.status === 'Fail') {
          var elIssue = document.getElementById('issue_' + q.id);
          var elPlan = document.getElementById('plan_' + q.id);
          var curIssue = (elIssue && elIssue.value.trim()) ? elIssue.value.trim() : (a.issue || "").trim();
          var curPlan = (elPlan && elPlan.value.trim()) ? elPlan.value.trim() : (a.actionPlan || "").trim();

          a.issue = curIssue;
          a.actionPlan = curPlan;

          if (!curIssue || !curPlan) {
            invalidFails.push(q.id);
          }
        }

        answersPayload.push({
          questionId: q.id,
          questionText: q.text,
          status: a.status,
          issue: a.issue || '',
          actionPlan: a.actionPlan || '',
          photoBase64: a.photo || ''
        });
      }
    }

    if (unans.length > 0) {
      alert("Masih ada " + unans.length + " butir pertanyaan yang belum diisi statusnya!");
      return;
    }

    if (invalidFails.length > 0) {
      alert("Butir " + invalidFails.join(", ") + " berstatus FAIL namun [Issue] atau [Action Plan] masih kosong!");
      return;
    }

    var curRole = (currentUser && currentUser.role) ? currentUser.role : "RM";
    var auditSiteCode = (currentUser && currentUser.storeCode !== "ALL") ? currentUser.storeCode : "272";
    if (curRole === "RM" || (currentUser && currentUser.storeCode === "ALL")) {
      var elSelStore = document.getElementById("selectAuditStore");
      if (elSelStore && elSelStore.value) {
        auditSiteCode = elSelStore.value;
      }
    }

    btn.disabled = true;
    btn.innerText = "Mengirim Laporan...";

    var payload = {
      siteCode: auditSiteCode,
      auditorName: currentUser ? currentUser.name : "Auditor",
      auditorRole: curRole,
      frequency: document.getElementById("selectFrequency").value,
      checklistType: document.getElementById("selectChecklistType") ? document.getElementById("selectChecklistType").value : "REGULAR",
      notes: document.getElementById("txtGlobalNotes").value,
      answers: answersPayload
    };

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerText = "Submit Laporan Walkthrough";
        if (res && res.success) {
          alert("Laporan Walkthrough berhasil dikirim dengan skor: " + res.score);
          formAnswers = {};
          renderQuestionsUI();
          loadAllOperationalData();
          switchTab('dashboard');
        } else {
          alert("Gagal submit: " + (res ? res.message : "Error"));
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerText = "Submit Laporan Walkthrough";
        alert("Koneksi gagal: " + err.toString());
      })
      .submitAuditWalkthrough(payload);
  }
</script>
