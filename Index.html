<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Matahari Store Visit Audit & Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#EE1D23', dark: '#C7141A', surface: '#FFF1F1', border: '#FECDD3' },
            corp: { dark: '#1E2022', muted: '#68717A', border: '#E5E7EB', surface: '#F8F9FA' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F4F6F8] text-corp-dark font-sans antialiased min-h-screen flex flex-col">

  <!-- 1. FULLSCREEN LOGIN OVERLAY -->
  <div id="fullAuthScreen" class="fixed inset-0 z-50 bg-[#F4F6F8] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-xl border border-corp-border shadow-xl p-6 space-y-4">
      <div class="text-center space-y-1">
        <div class="inline-block bg-brand text-white font-black text-sm px-3 py-1 rounded shadow-xs tracking-wider">MATAHARI</div>
        <h2 class="text-sm font-black text-corp-dark uppercase tracking-wider pt-2">Store Visit Audit System</h2>
        <p class="text-[11px] text-corp-muted">Please sign in with your registered credentials</p>
      </div>

      <form id="authLoginForm" onsubmit="executeAppLogin(event)" class="space-y-3 pt-2 text-xs">
        <div>
          <label class="block font-black uppercase text-[10px] text-corp-muted mb-1">Employee ID / NIK *</label>
          <input type="text" id="inputAuthId" required placeholder="e.g. M007803 or M223247" class="w-full p-2.5 rounded border border-corp-border bg-corp-surface font-bold text-corp-dark focus:bg-white focus:outline-hidden">
        </div>
        <div>
          <label class="block font-black uppercase text-[10px] text-corp-muted mb-1">PIN / Password *</label>
          <input type="password" id="inputAuthPin" required placeholder="Enter your PIN" class="w-full p-2.5 rounded border border-corp-border bg-corp-surface font-bold text-corp-dark focus:bg-white focus:outline-hidden">
        </div>
        <div id="authErrorMsg" class="hidden p-2.5 rounded bg-rose-50 border border-rose-200 text-rose-900 font-bold text-[11px] leading-tight"></div>
        <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 rounded bg-brand hover:bg-brand-dark text-white font-black text-xs uppercase tracking-wider shadow-xs transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- 2. MAIN APP HEADER -->
  <header id="mainAppHeader" class="hidden bg-white border-b border-corp-border sticky top-0 z-40 shadow-xs print:hidden">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-brand text-white font-black text-xs px-2.5 py-1 rounded shadow-xs">MDS</div>
        <div>
          <h1 class="text-xs font-black uppercase tracking-wider text-corp-dark">Store Visit Audit</h1>
          <p id="hdrStoreName" class="text-[11px] font-bold text-corp-muted leading-tight">-</p>
        </div>
      </div>

      <nav class="flex bg-slate-100 p-1 rounded-lg border border-corp-border">
        <button type="button" id="tabBtnChecklist" onclick="switchTab('checklist')" class="px-3 py-1 font-black text-xs text-brand bg-white rounded shadow-xs transition">Checklist</button>
        <button type="button" id="tabBtnDashboard" onclick="switchTab('dashboard')" class="px-3 py-1 font-semibold text-xs text-corp-muted hover:text-corp-dark transition">Dashboard</button>
        <button type="button" id="tabBtnResult" onclick="switchTab('result')" class="px-3 py-1 font-semibold text-xs text-corp-muted hover:text-corp-dark transition">Result Masukan</button>
      </nav>

      <div class="flex items-center space-x-3 text-right">
        <!-- TRIAL SELECTOR KHUSUS NIK M223247 -->
        <div id="trialRoleSelectorContainer" class="hidden border-r border-corp-border pr-3">
          <select id="selTrialRole" onchange="switchTrialRole(this.value)" class="px-2 py-1 rounded border border-amber-300 bg-amber-50 text-amber-900 font-black text-[10px] focus:outline-hidden">
            <option value="RM">Trial: Regional Manager (RM)</option>
            <option value="SM">Trial: Store Manager (SM)</option>
            <option value="ASM">Trial: Asst Store Manager (ASM)</option>
            <option value="SA">Trial: Supervisor Area (SA)</option>
          </select>
        </div>

        <div>
          <span id="hdrUserName" class="text-xs font-black text-corp-dark block">-</span>
          <span id="hdrUserRole" class="text-[10px] text-corp-muted block font-semibold">-</span>
        </div>
        <button type="button" onclick="executeSafeLogout()" class="px-3 py-1 rounded border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-900 font-bold text-xs shadow-xs transition">Logout</button>
      </div>
    </div>
  </header>

  <!-- 3. MAIN APPLICATION CONTAINER -->
  <div id="mainAppContainer" class="hidden flex-1">
    <?!= include('ChecklistModule'); ?>
    <?!= include('DashboardModule'); ?>
    <?!= include('ResultModule'); ?>
  </div>

  <script>
    var currentUser = null;
    var masterData = { stores: [], questions: [], brands: [], divisions: [] };

    function switchTab(tabName) {
      try {
        var viewForm = document.getElementById("auditFormView");
        var viewDash = document.getElementById("dashboardView");
        var viewResult = document.getElementById("resultView");

        var btnChecklist = document.getElementById("tabBtnChecklist");
        var btnDashboard = document.getElementById("tabBtnDashboard");
        var btnResult = document.getElementById("tabBtnResult");

        if (viewForm) viewForm.classList.add("hidden");
        if (viewDash) viewDash.classList.add("hidden");
        if (viewResult) viewResult.classList.add("hidden");

        var inactCls = "px-3 py-1 font-semibold text-xs text-corp-muted hover:text-corp-dark transition";
        var actCls = "px-3 py-1 font-black text-xs text-brand bg-white rounded shadow-xs transition";

        if (btnChecklist) btnChecklist.className = inactCls;
        if (btnDashboard) btnDashboard.className = inactCls;
        if (btnResult) btnResult.className = inactCls;

        if (tabName === 'checklist') {
          if (viewForm) viewForm.classList.remove("hidden");
          if (btnChecklist) btnChecklist.className = actCls;
          if (typeof syncChecklistControls === "function") syncChecklistControls();
        } else if (tabName === 'dashboard') {
          if (viewDash) viewDash.classList.remove("hidden");
          if (btnDashboard) btnDashboard.className = actCls;
          if (typeof renderDashboardView === "function") renderDashboardView();
        } else if (tabName === 'result') {
          if (viewResult) viewResult.classList.remove("hidden");
          if (btnResult) btnResult.className = actCls;
          if (typeof renderActionItemsTable === "function") renderActionItemsTable();
        }
      } catch (err) {
        console.error("Gagal switchTab:", err);
      }
    }

    function executeAppLogin(e) {
      e.preventDefault();
      var idVal = document.getElementById("inputAuthId").value.trim();
      var pinVal = document.getElementById("inputAuthPin").value.trim();
      var btn = document.getElementById("btnAuthSubmit");
      var errEl = document.getElementById("authErrorMsg");

      btn.disabled = true;
      btn.innerText = "Verifying...";
      errEl.classList.add("hidden");

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = "Sign In";
          if (res && res.success) {
            currentUser = res.user;
            try { localStorage.setItem("MDS_AUDIT_USER", JSON.stringify(currentUser)); } catch(e){}
            setupUserSession();
          } else {
            errEl.innerText = res ? res.message : "Authentication failed.";
            errEl.classList.remove("hidden");
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = "Sign In";
          errEl.innerText = "Server connection error: " + err.toString();
          errEl.classList.remove("hidden");
        })
        .verifyLoginCredentials(idVal, pinVal);
    }

    function setupUserSession() {
      if (!currentUser) return;
      document.getElementById("fullAuthScreen").classList.add("hidden");
      document.getElementById("mainAppHeader").classList.remove("hidden");
      document.getElementById("mainAppContainer").classList.remove("hidden");

      document.getElementById("hdrUserName").innerText = currentUser.name;
      document.getElementById("hdrUserRole").innerText = currentUser.jobTitle + " • " + currentUser.id;
      document.getElementById("hdrStoreName").innerText = (currentUser.storeCode && currentUser.storeCode !== "ALL") 
        ? "Toko " + currentUser.storeCode 
        : "Regional Fleet (All Stores)";

      var trialContainer = document.getElementById("trialRoleSelectorContainer");
      if (currentUser.id && currentUser.id.toUpperCase() === "M223247") {
        if (trialContainer) trialContainer.classList.remove("hidden");
        var selTrial = document.getElementById("selTrialRole");
        if (selTrial) selTrial.value = currentUser.role || "RM";
      } else {
        if (trialContainer) trialContainer.classList.add("hidden");
      }

      google.script.run
        .withSuccessHandler(function(res) {
          if (res) {
            masterData = res;
            if (typeof syncChecklistControls === "function") syncChecklistControls();
            loadAllOperationalData();
            switchTab('dashboard');
          }
        })
        .getMasterData();
    }

    function switchTrialRole(newRole) {
      if (!currentUser || currentUser.id.toUpperCase() !== "M223247") return;
      currentUser.role = newRole;
      
      var jobMap = {
        "RM": "REGIONAL MANAGER",
        "SM": "STORE MANAGER",
        "ASM": "ASSISTANT STORE MANAGER",
        "SA": "SUPERVISOR AREA"
      };
      currentUser.jobTitle = jobMap[newRole] || newRole;
      document.getElementById("hdrUserRole").innerText = currentUser.jobTitle + " • " + currentUser.id;
      
      if (typeof syncChecklistControls === "function") syncChecklistControls();
      if (typeof loadAllOperationalData === "function") loadAllOperationalData();
    }

    function executeSafeLogout() {
      try { localStorage.removeItem("MDS_AUDIT_USER"); } catch(e){}
      currentUser = null;
      document.getElementById("inputAuthId").value = "";
      document.getElementById("inputAuthPin").value = "";
      document.getElementById("authErrorMsg").classList.add("hidden");

      document.getElementById("mainAppHeader").classList.add("hidden");
      document.getElementById("mainAppContainer").classList.add("hidden");
      document.getElementById("fullAuthScreen").classList.remove("hidden");
    }

    window.addEventListener("DOMContentLoaded", function() {
      try {
        var saved = localStorage.getItem("MDS_AUDIT_USER");
        if (saved) {
          currentUser = JSON.parse(saved);
          setupUserSession();
          return;
        }
      } catch(e){}
      document.getElementById("fullAuthScreen").classList.remove("hidden");
    });
  </script>
</body>
</html>
